# Render Blueprint — deploys the Rent Manager backend (free tier only).
#
# Creates a managed Postgres and the FastAPI web service from
# apps/backend/Dockerfile. Render injects DATABASE_URL as a bare connection
# string; config.py derives the async/sync SQLAlchemy URLs from it.
#
# Everything you use works on free: manual reminders, payments, all CRUD, the
# dashboard. The only thing not running is the *automatic* scheduled reminder
# ladder / weekly summary — those need a Celery worker + Redis, which require
# Render's paid (starter) plan. To add them later, see the commented block at
# the bottom of this file.

databases:
  - name: rent-db
    databaseName: rent_manager
    user: rent
    plan: free

services:
  - type: web
    name: rent-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    healthCheckPath: /health
    # Run migrations, seed demo data (idempotent — skips if already seeded),
    # then start the API on the port Render assigns.
    dockerCommand: sh -c "alembic upgrade head && python -m scripts.seed_dev_data && uvicorn rent_manager.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - fromGroup: rent-env
      - key: DATABASE_URL
        fromDatabase:
          name: rent-db
          property: connectionString

envVarGroups:
  - name: rent-env
    envVars:
      # "demo" (not "production") keeps the dev OTP hint visible on the verify
      # screen so anyone you share the link with can log in. Set to "production"
      # to hide it.
      - key: ENV
        value: demo
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_FIXED
        value: "123456"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: LOG_LEVEL
        value: INFO
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: SES_ENABLED
        value: "false"
      - key: RAZORPAY_ENABLED
        value: "false"

