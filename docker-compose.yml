services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: rent
      POSTGRES_PASSWORD: rent
      POSTGRES_DB: rent_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rent -d rent_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/backend
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://rent:rent@postgres:5432/rent_manager
      DATABASE_SYNC_URL: postgresql+psycopg2://rent:rent@postgres:5432/rent_manager
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn rent_manager.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./apps/backend/src:/app/src
      - ./apps/backend/migrations:/app/migrations

  worker:
    build:
      context: ./apps/backend
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://rent:rent@postgres:5432/rent_manager
      DATABASE_SYNC_URL: postgresql+psycopg2://rent:rent@postgres:5432/rent_manager
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    command: celery -A rent_manager.workers.celery_app worker --loglevel=info -Q default,notifications,webhooks,scheduled --concurrency=4
    volumes:
      - ./apps/backend/src:/app/src

  beat:
    build:
      context: ./apps/backend
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://rent:rent@postgres:5432/rent_manager
      DATABASE_SYNC_URL: postgresql+psycopg2://rent:rent@postgres:5432/rent_manager
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    command: celery -A rent_manager.workers.celery_app beat --loglevel=info
    volumes:
      - ./apps/backend/src:/app/src

volumes:
  postgres_data:
  redis_data:
